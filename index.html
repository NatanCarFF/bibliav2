<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Bíblia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <h1>Minha Bíblia</h1>
    </header>
    <main>
        <div class="controls">
            <select id="book-select">
                <option value="">Selecione um livro</option>
            </select>
            <select id="chapter-select" disabled>
                <option value="">Selecione um capítulo</option>
            </select>
        </div>

        <div class="settings">
            <label for="font-size-select">Tamanho da Fonte:</label>
            <select id="font-size-select">
                <option value="1.0">Padrão</option>
                <option value="1.1">Médio</option>
                <option value="1.2">Grande</option>
                <option value="1.3">Muito Grande</option>
            </select>
            <button id="theme-toggle-btn" title="Alternar Modo Escuro/Claro">
                <i class="fas fa-moon"></i>
                <span>Modo Escuro</span>
            </button>
        </div>

        <div id="loading-indicator" class="loading-indicator" style="display: none;">
            <div class="spinner"></div>
            <p>Carregando Bíblia...</p>
        </div>

        <div id="bible-content">
            <p class="initial-message">Selecione um livro e um capítulo para começar a ler.</p>
        </div>

        <div class="chapter-navigation">
            <button id="prev-chapter-btn" disabled>
                <i class="fas fa-chevron-left"></i>
                <span>Capítulo Anterior</span>
            </button>
            <button id="next-chapter-btn" disabled>
                <span>Próximo Capítulo</span>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div id="last-read-info" class="initial-message" style="margin-top: 20px;">
            Carregando última leitura...
        </div>
    </main>
